<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gemini)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Glow Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#gemini)" opacity="0.18" filter="url(#glow)"/>
  
  <!-- Central Stylized A + Sparkle Core -->
  <path d="M256 96 L292 208 L404 244 L292 280 L256 392 L220 280 L108 244 L220 208 Z" fill="url(#gemini)" filter="url(#glow)"/>
  
  <!-- Inner White Sparkle Core -->
  <path d="M256 160 L274 226 L340 244 L274 262 L256 328 L238 262 L172 244 L238 226 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Global Hub Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="10 6" opacity="0.45" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="10 6" opacity="0.4" transform="rotate(25 256 256)"/>
  
  <!-- Accent Amber Star -->
  <circle cx="360" cy="140" r="12" fill="url(#amber)" filter="url(#glow)"/>
  <circle cx="150" cy="360" r="8" fill="#38bdf8" opacity="0.8"/>
</svg>
